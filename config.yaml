# DAHS — single source of truth for simulation, objective and model parameters.
# Loaded with OmegaConf at every experiment entry point.
#
# REVISION NOTE. Keys removed relative to the submitted version:
#   sim.arrivals.batch_prob, sim.arrivals.batch_size_triangular
#     Declared, documented as "Boysen et al. 2019 waves", and read by nothing.
#     Arrivals were pure Poisson. Removed rather than left advertising an
#     unimplemented feature.
#   baselines.linucb.feature_dim
#     Now derived from simulation.state_extractor.N_FEATURES so the two cannot
#     drift apart.
#   baselines.offline_ld.enabled
#     Dead switch; the offline-RL baseline is offline_fqi.

run_id: dev

# ---------------------------------------------------------------------------
# Random seeds
# ---------------------------------------------------------------------------
seeds:
  sim: 42
  model: 1337
  ppo: 2024
  rollout: 20260804          # base seed for branch() streams; see labeling.rollout_labeler

# ---------------------------------------------------------------------------
# Warehouse simulation
# ---------------------------------------------------------------------------
sim:
  shift_hours: 8
  interval_minutes: 15            # -> 32 periodic-review decision epochs
  n_pickers: 10
  queue_capacity: 200             # overflow is recorded as `dropped`, not discarded

  arrivals:
    arrival_mode: poisson         # 'poisson' | 'olist' (empirical burstiness, CV 2.68)
    base_rate_per_minute: 1.65

  order_attrs:
    # All three triangulars are stated in the main text, not only the appendix
    # (Reviewer 1, 5.c). Values are reported as (min, mode, max) in minutes.
    processing_time_triangular: [2.0, 5.0, 12.0]     # pick time
    sla_due_triangular:         [15.0, 45.0, 90.0]   # CUSTOMER clock, from arrival
    shelf_life_triangular:      [20.0, 60.0, 120.0]  # PRODUCT clock, from arrival
    perishable_prob: 0.2
    priority_classes: [low, medium, high]
    priority_weights: [0.5, 0.35, 0.15]              # class mix, not economic weight

# ---------------------------------------------------------------------------
# Objective (Section 3)
# ---------------------------------------------------------------------------
# Fixed before any learning; never tuned per method. See simulation/cost.py.
#
#   w_holding is a work-in-progress HOLDING cost, not the penalty for failure.
#   In the submitted version it was the only charge an unfinished order ever
#   attracted, which made abandoning an order 600x cheaper than serving it late
#   (Reviewer 2, 1). Unserved orders are now charged w_breach through the
#   censored outcome predicates in simulation/orders.py.
objective:
  w_breach: 3.0                 # missed the customer deadline
  w_tardy: 0.2                  # per minute of lateness
  w_spoil: 5.0                  # perishable passed its product deadline
  w_holding: 0.005              # per queued order, WIP holding
  use_priority_weights: true    # charge w_o per order, matching WSPT/ATC's ranking key

# ---------------------------------------------------------------------------
# Dispatching rules
# ---------------------------------------------------------------------------
heuristics:
  # Stage-1 screening candidates. `pool` is overwritten with the survivors by
  # experiments/calibrate_rules.py; see simulation/heuristics.py for provenance.
  pool: [FIFO, EDD, FEFO, WSPT, ATC, MS, MDD, COVERT]

  # ATC look-ahead scale. CALIBRATED, not assumed (Reviewer 1, 4.c): WSPT is the
  # k -> inf limit of ATC, so a fitted k cannot lose to WSPT. The submitted value
  # was an uncalibrated 2.0. Both calibrations the reviewer asks for are run by
  # experiments/calibrate_rules.py and the deployed value is written back here.
  atc_lookahead_k: 3.0   # FITTED by Stage 1 (portfolio); standalone k*=1.5, portfolio k*=3.0
  covert_lookahead_k: 4.0   # FITTED by Stage 1 (portfolio); standalone k*=4.0, portfolio k*=4.0
  calibration:
    k_grid: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0, 20.0]
    # There is no `mode` switch. BOTH calibrations Reviewer 1 (4.c) asks for are
    # always computed and always reported; the portfolio value is the one
    # deployed, because the pool is what ships. A switch here would let one of
    # the two go unreported, which is the thing the reviewer is guarding against.
    # Calibration only has to RANK k values, not produce deployable labels, so
    # it runs at a much smaller rollout budget than labelling. At M=20 the
    # k-sweep costs ~12.3M interval-steps — six times the entire labelling
    # stage — because it is a full label pass per k per parameterised rule.
    # M=5 cuts that to ~3M with no effect on the ranking, since the k values
    # are compared under common random numbers and the comparison is paired.
    n_rollout_samples: 5

  fefo_mask_threshold: 0.05       # mask FEFO when pct_perishable < this

# ---------------------------------------------------------------------------
# Shift corpora
# ---------------------------------------------------------------------------
# Three disjoint seed blocks drawn from one SeedSequence: train, calibration,
# test. The calibration block is new — the submitted version tuned ATC not at
# all and selected the label temperature on the training corpus, so there was no
# split on which rule hyperparameters could be fitted without touching train or
# test (Reviewer 1, 4.c).
shifts:
  seed_seq_root: 42
  # 250 train shifts, not 100. An earlier draft cut this to 100 on the strength
  # of the submitted sample-efficiency result, which is circular: that result is
  # itself being re-derived. It also runs against Section 6.12's own argument
  # that the statistical cost of an |H|-class problem grows faster than linearly
  # in |H| — and the pool has doubled from four rules to eight. Labelling cost is
  # linear in shifts and is not the bottleneck (rule calibration is), so the
  # corpus stays large.
  n_train: 250
  n_calib: 30
  n_test: 50

# ---------------------------------------------------------------------------
# Rollout labelling
# ---------------------------------------------------------------------------
labeling:
  tau: 4                          # rollout horizon in intervals; swept over {1,2,3,4}
  n_rollout_samples: 20           # M — independent continuations per (state, rule)
  # Behaviour policy generating the state-visitation corpus. MUST NOT be
  # 'round_robin': `interval_index_in_shift` is an observed feature, so
  # `a = i % |H|` makes the action a deterministic function of the state and
  # every shift logs the identical sequence. Conditional coverage is then
  # degenerate and fitted Q-iteration is asked to extrapolate to actions never
  # taken near the state — the pathology Section 6.10 claimed did not arise
  # (Reviewer 1, 6.b). 'round_robin' is retained in the code only so
  # `rl_sensitivity coverage` can measure the two head to head.
  observed_policy: random
  beta_grid: [0.1, 0.25, 0.5, 1.0, 2.0]
  # Target median label entropy, as a FRACTION of log|H| rather than in nats.
  # The submitted value was an absolute [0.3, 0.7] chosen when |H| = 4, i.e.
  # 22-51% of the log 4 maximum. Doubling the pool to eight (Reviewer 1, 4.d)
  # would have left the same absolute band meaning 14-34% of log 8, sharpening
  # every label as a side effect of adding rules. These fractions reproduce the
  # submitted band's intent at whatever pool Stage 1 settles on.
  target_median_entropy_ratio: [0.216, 0.505]
  ambiguity_filter:
    # Top-1 confidence threshold, as a MULTIPLE OF UNIFORM (1/|H|) rather than
    # an absolute probability. The submitted 0.55 was set when |H| = 4, where
    # uniform is 0.25 — so it meant 2.2x chance and kept 865/1600 test states.
    # With the pool doubled (Reviewer 1, 4.d) the same 0.55 means 4.4x chance:
    # a smoke run kept 6% of states. The test corpus would have collapsed as a
    # side effect of adding rules. 2.2 reproduces the submitted filter at any K.
    theta_confidence_uniform_multiple: 2.2
  # NOTE. There is no `record_standard_error` switch: the per-cell standard
  # error is ALWAYS recorded (`se_<rule>` columns) and always summarised into
  # `label_meta.json`. Reviewer 2 (3) asks for the variance to be reported, and
  # a flag that could turn it off would be a way to not report it.

# ---------------------------------------------------------------------------
# Regime discovery
# ---------------------------------------------------------------------------
regime:
  # Grid widened so BIC can actually turn. On the submitted feature matrix BIC
  # fell monotonically to K=6, the edge of {3,4,5,6}, because two degenerate
  # features made the covariance singular; both are now removed
  # (simulation/state_extractor.py).
  k_grid: [2, 3, 4, 5, 6, 7, 8, 10, 12]
  n_init: 5                       # was 1; single-start BIC confounds K with init luck
  ari_threshold: 0.85
  n_ari_refits: 10

# ---------------------------------------------------------------------------
# Ranker
# ---------------------------------------------------------------------------
ranker:
  objective: multi:softprob
  sample_weight: inverse_label_entropy
  cv:
    n_splits: 5
    group_col: shift_id
  hyperparams:
    max_depth: [4, 6, 8]
    n_estimators: [200, 500, 1000]
    learning_rate: [0.03, 0.1]
  calibration:
    method: isotonic
    calibration_split: 0.20
  switching:
    t_min_intervals: 2
    entropy_gate_ratio: 0.5

# ---------------------------------------------------------------------------
# Baselines
# ---------------------------------------------------------------------------
baselines:
  # The distillation teacher, never evaluated in the submitted version
  # (Reviewer 2, 6). Evaluates every rule over `tau` intervals averaged over
  # `n_samples` branches, commits the best for one interval, replans.
  rolling_horizon_mpc:
    tau: 4
    n_samples: 5                  # per-decision cost is |H| * tau * n_samples steps

  ppo_fair:
    total_timesteps: 8000
  ppo_full:
    total_timesteps: 500000
  # Sensitivity grid demanded by Reviewer 1 (6.b). The submitted PPO used stock
  # hyperparameters with no observation or reward normalisation, so the claim
  # that its failure was "structural, not budgetary" was untested.
  ppo_sensitivity:
    gamma:             [0.90, 0.99, 1.0]
    gae_lambda:        [0.90, 0.95, 0.99]
    n_steps:           [32, 64, 256]
    ent_coef:          [0.0, 0.01, 0.05]
    normalize_obs:     [true, false]
    normalize_reward:  [true, false]

  linucb:
    alpha: 1.0
    standardize_features: true    # was absent; raw features let the largest scale dominate

  offline_fqi:
    gamma: 0.99
    n_iterations: 20
    xgb:
      max_depth: 4
      n_estimators: 200
      learning_rate: 0.05
    hp_grid:
      gamma:         [0.90, 0.95, 0.99]
      max_depth:     [4, 6]
      n_estimators:  [200, 500]
      learning_rate: [0.05]
    # Give FQI the same 6 regime posteriors the ranker sees, so the comparison
    # isolates the training signal rather than the feature set.
    use_regime_features: true

# ---------------------------------------------------------------------------
# Experiments
# ---------------------------------------------------------------------------
experiments:
  scenarios:
    low_load:         { arrivals: { base_rate_per_minute: 1.0 }, order_attrs: { perishable_prob: 0.0 } }
    balanced:         { arrivals: { base_rate_per_minute: 1.5 }, order_attrs: { perishable_prob: 0.2 } }
    high_load_perish: { arrivals: { base_rate_per_minute: 2.2 }, order_attrs: { perishable_prob: 0.4 } }

  e2:
    data_efficiency_budgets: [10, 25, 50, 100]
    data_efficiency_reps: 5

  e3_ablations:
    - no_regime                  # declared but never run in the submitted version
    - no_calibration
    - no_switching_controller
    - tau1_snapshot_only
    - hard_labels
    - random_ambiguity_filter
    - top5_features              # Reviewer 3 (4): parsimonious state representation
    - single_sample_rollout      # M=1, i.e. the submitted labelling scheme

  e4_sensitivity:
    tau:           [1, 2, 3, 4]
    n_samples:     [1, 5, 10, 20]   # the variance arm of Propositions 1 and 2
    t_min:         [0, 1, 2, 3, 4]
    theta:         [0.40, 0.50, 0.55, 0.60, 0.70]
    arrival_noise: [0.5, 1.0, 1.5, 2.0]   # multiplier on the base arrival rate
    # Objective-weight sensitivity. Reviewer 1 (6.c) asked that the composite
    # cost be made the primary metric, which it now is (experiments/stats.py) —
    # and that promotion makes the weights the load-bearing assumption of every
    # reported comparison. A reviewer who accepts "the objective is primary"
    # will immediately ask what happens when it changes, so the weights are
    # swept rather than merely declared fixed-before-learning.
    #
    # w_spoil in particular is a judgement we introduced in this revision:
    # 5.0 encodes "destroyed stock costs more than a late shipment". The sweep
    # reports whether the method ranking is invariant to that judgement. If it
    # is not, the paper must say at which ratio the conclusion flips.
    w_breach:      [1.0, 3.0, 6.0]
    w_spoil:       [1.0, 3.0, 5.0, 10.0]
    w_tardy:       [0.1, 0.2, 0.5]
    w_holding:     [0.0, 0.005, 0.05]

  # Model misspecification: label under nominal parameters, evaluate under
  # perturbed ones (Reviewer 2, 5). Proposition 1 bounds truncation error only.
  e10_misspecification:
    arrival_rate_scale:    [0.8, 0.9, 1.0, 1.1, 1.25]
    processing_time_scale: [0.8, 0.9, 1.0, 1.1, 1.25]
    sla_scale:             [0.8, 1.0, 1.25]
    # The PRODUCT clock, perturbed independently of the customer clock. This
    # revision introduced shelf life as a modelled parameter, so it is estimated
    # from data as imperfectly as the rest — and it is the axis that changes
    # which of the two deadlines binds first.
    shelf_life_scale:      [0.8, 1.0, 1.25]
    n_pickers_delta:       [-2, -1, 0, 1, 2]

  stats:
    bootstrap_resamples: 10000
    fdr_q: 0.05
    test: wilcoxon
    primary_metric: composite_cost       # Reviewer 1 (6.c): the objective is primary
    secondary_metrics: [service_failure_rate, sla_breach_rate_arrived, mean_tardiness,
                        spoilage_rate, throughput, unserved, picker_utilization]

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO
  rotation_mb: 50
