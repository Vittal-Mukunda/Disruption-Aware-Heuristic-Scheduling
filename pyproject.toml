[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dahs"
version = "0.1.0"
description = "Rollout-Informed Label Distribution Learning for Adaptive Heuristic Selection in Dynamic Warehouse Dispatching"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Vittal Mukunda", email = "vittalmukunda.im24@rvce.edu.in" },
    { name = "Atharva Somani", email = "atharvasomani.im24@rvce.edu.in" },
    { name = "Pranjal Malaiya", email = "pranjalmalaiya.im24@rvce.edu.in" },
]
license = { text = "Proprietary" }

# Every entry below is imported somewhere in the package. Four declared
# dependencies were removed in revision because nothing imported them:
# `simpy` (the simulator is a deterministic periodic-review model and its own
# docstring says it deliberately does not use SimPy — yet the README's smoke
# test imported it), `tqdm`, `hydra-core` (configuration is OmegaConf +
# argparse throughout), and `sb3-contrib` (declared "appendix only" for a
# RecurrentPPO/QRDQN baseline that does not exist in the repository).
dependencies = [
    # --- Core simulation & data ---
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<3",
    "pyarrow>=14.0",
    "scipy>=1.11,<2",

    # --- ML / modeling ---
    "scikit-learn>=1.3,<2",
    "xgboost>=2.0,<3",
    "shap>=0.44,<1",

    # --- Plotting ---
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",

    # --- Parallel / logging / config ---
    "joblib>=1.3,<2",
    "loguru>=0.7,<1",
    "omegaconf>=2.3,<3",

    # --- DRL baseline ---
    "stable-baselines3>=2.0,<3",
    "gymnasium>=0.29,<2",
    "torch>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "ipython>=8",
    "jupyter>=1.0",
]

[tool.setuptools]
# Flat-layout: top-level packages are the project module directories.
packages = [
    "simulation",
    "labeling",
    "regime",
    "models",
    "baselines",
    "experiments",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length governed by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
