[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dahs"
version = "0.1.0"
description = "Rollout-Informed Label Distribution Learning for Adaptive Heuristic Selection in Dynamic Warehouse Dispatching"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "vittal.muku@gmail.com" }]
license = { text = "Proprietary" }

dependencies = [
    # --- Core simulation & data ---
    "simpy>=4.0.1,<5",
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<3",
    "pyarrow>=14.0",
    "scipy>=1.11,<2",

    # --- ML / modeling ---
    "scikit-learn>=1.3,<2",
    "xgboost>=2.0,<3",
    "shap>=0.44,<1",

    # --- Plotting ---
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",

    # --- Parallel / progress / logging / config ---
    "joblib>=1.3,<2",
    "tqdm>=4.65,<5",
    "loguru>=0.7,<1",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",

    # --- DRL baseline ---
    "stable-baselines3>=2.0,<3",
    "gymnasium>=0.29,<2",
    "torch>=2.0,<3",

    # --- Appendix only (RecurrentPPO, maskable QRDQN for Offline-LD-style baseline) ---
    "sb3-contrib>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "ipython>=8",
    "jupyter>=1.0",
]

[tool.setuptools]
# Flat-layout: top-level packages are the project module directories.
packages = [
    "simulation",
    "labeling",
    "regime",
    "models",
    "baselines",
    "experiments",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length governed by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
